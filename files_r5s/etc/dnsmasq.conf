#### Tinkerbell on rk3588ng: 192.168.76.140 (BGP LoadBalancer; std tinkerbell-suite). From kohntarkosz-clusters'
#### gitops/router/tinkerbell-dnsmasq.yaml.ftl; replaces any previous Tinkerbell block for rk3588ng.
# Smee's own DHCP is off: this dnsmasq is the only DHCP server, and points PXE clients at 192.168.76.140.
# 192.168.76.140 is off-subnet for LAN clients: they reach it through the router (BGP route). UEFI, iPXE and U-Boot use the DHCP
# gateway; test each device class, firmware that insists on an on-link TFTP server needs a router-side workaround.
#
# Tags for your dhcp-host entries (tag in OpenWRT LuCI):
# tink_pxelinux_rk3588ng: u-boot/PXELinux.cfg (via TFTP)
# tink_pxelinux_http_rk3588ng: u-boot/PXELinux.cfg (via HTTP)
# tink_uefi_x86_pxe_rk3588ng: UEFI for x86
# tink_uefi_arm64_pxe_rk3588ng: UEFI for arm64
# tink_uefi_x86_http_boot_rk3588ng: UEFI HTTP Boot for x86
# tink_uefi_arm64_http_boot_rk3588ng: UEFI HTTP Boot for arm64
# tink_rpi_rk3588ng: RPi native EEPROM firmware

# Create a tag for DHCP clients that announce themselves as Tinkerbell (namely: Tinkerbell's build of iPXE)
dhcp-match=tinkerbell, option:user-class, Tinkerbell

# For u-boot pxelinux.cfg clients (via TFTP):
dhcp-boot=tag:tink_pxelinux_rk3588ng,tinkpxelinux-not-really-used.conf,none,192.168.76.140

# For u-boot pxelinux.cfg clients (via HTTP):
dhcp-boot=tag:tink_pxelinux_http_rk3588ng,http://192.168.76.140:7080/tftp/

# For x86 UEFI clients: (first is for UEFI PXE -> 2nd is for Tinkerbell's iPXE)
dhcp-boot=tag:tink_uefi_x86_pxe_rk3588ng,tag:!tinkerbell,ipxe.efi,192.168.76.140,192.168.76.140
dhcp-boot=tag:tink_uefi_x86_pxe_rk3588ng,tag:tinkerbell,http://192.168.76.140:7080/ipxe/script/auto.ipxe

# For arm64 UEFI clients: (first is for UEFI PXE -> 2nd is for Tinkerbell's iPXE)
dhcp-boot=tag:tink_uefi_arm64_pxe_rk3588ng,tag:!tinkerbell,snp-arm64.efi,192.168.76.140,192.168.76.140
dhcp-boot=tag:tink_uefi_arm64_pxe_rk3588ng,tag:tinkerbell,http://192.168.76.140:7080/ipxe/script/auto.ipxe

# For RaspberryPi (4b, at least) native EEPROM firmware booting (use it to chainload u-boot and pxelinux.cfg)
#                                Extra options for server-ip-address and tftp-server are required
#                                *Never* try to replace it with pxe-service= directive, as that breaks the others
dhcp-boot=tag:tink_rpi_rk3588ng,tinkrpi6,,192.168.76.140
dhcp-option=tag:tink_rpi_rk3588ng,option:server-ip-address,192.168.76.140
dhcp-option=tag:tink_rpi_rk3588ng,option:tftp-server,"192.168.76.140"

# For x86 UEFI HTTP Boot clients: (first is for UEFI HTTP Boot -> 2nd is for Tinkerbell's iPXE)
dhcp-boot=tag:tink_uefi_x86_http_boot_rk3588ng,tag:!tinkerbell,http://192.168.76.140:7080/ipxe/binary/ipxe.efi
dhcp-boot=tag:tink_uefi_x86_http_boot_rk3588ng,tag:tinkerbell,http://192.168.76.140:7080/ipxe/script/auto.ipxe
# UEFI HTTP Boot clients require option 60 to say "HTTPClient" or they ignore the DHCPOFFER entirely
dhcp-option=tag:tink_uefi_x86_http_boot_rk3588ng,60,HTTPClient

# For arm64 UEFI HTTP Boot clients: (first is for UEFI HTTP Boot -> 2nd is for Tinkerbell's iPXE)
dhcp-boot=tag:tink_uefi_arm64_http_boot_rk3588ng,tag:!tinkerbell,http://192.168.76.140:7080/ipxe/binary/snp-arm64.efi
dhcp-boot=tag:tink_uefi_arm64_http_boot_rk3588ng,tag:tinkerbell,http://192.168.76.140:7080/ipxe/script/auto.ipxe
# UEFI HTTP Boot clients require option 60 to say "HTTPClient" or they ignore the DHCPOFFER entirely
dhcp-option=tag:tink_uefi_arm64_http_boot_rk3588ng,60,HTTPClient




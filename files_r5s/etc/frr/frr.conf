password zebra
log syslog
access-list vty permit 127.0.0.0/8
access-list vty deny any
line vty
 access-class vty

frr defaults traditional
hostname OpenWrt-R5S

# BFD profile for fast failover: 300ms x3 => sub-second detection. Applied to NODEPEERS below.
# NOTE: requires bfdd to be enabled (see comment at bottom); a profile on its own does nothing.
bfd
 profile fast
  transmit-interval 300
  receive-interval 300
  detect-multiplier 3

# 65000 here, 65000 on the nodes == iBGP
router bgp 65000
 bgp router-id 192.168.66.1
 no bgp ebgp-requires-policy

 # Graceful restart: keep forwarding across a peer's control-plane (BGP daemon) restart. Negotiated
 # per session via BGP capabilities, so peers that don't support it simply ignore it. It only takes
 # effect on (re)established sessions, so it rolls in naturally as CAPI replaces nodes with FRR ones
 # -- no forced flap of the current kube-vip/Cilium sessions. (You may need 'clear bgp *' to make it
 # active on already-established sessions, but that is optional; new sessions get it automatically.)
 bgp graceful-restart
 bgp graceful-restart notification

 # create a peer-group for all dynamic iBGP neighbors
 neighbor NODEPEERS peer-group
 neighbor NODEPEERS remote-as 65000
 neighbor NODEPEERS next-hop-self # unsure about this

 # BFD for the peer-group. Default (non-strict) mode: BGP still establishes for peers that do NOT run
 # BFD, so this is SAFE during the rollout -- current kube-vip(alias)/Cilium sessions keep working as
 # plain iBGP and are unaffected; only the new node-local FRR peers actually activate a BFD session.
 # check-control-plane-failure pairs BFD with graceful-restart (honour the C-bit so a peer's bgpd
 # restart doesn't get killed by BFD while the dataplane keeps forwarding).
 neighbor NODEPEERS bfd profile fast
 neighbor NODEPEERS bfd check-control-plane-failure

 # reduce BGP timers (keepalive / hold)
 timers bgp 3 9

 # activate IPv4 unicast for the peer-group
 address-family ipv4 unicast
  neighbor NODEPEERS activate
 exit-address-family

 # allow dynamic neighbors from the 0.0/16 subnet
 # NOTE: intentionally left at /16 (NOT narrowed to /24) so old alias-source kube-vip peers
 #       (192.168.56.x) and new node-local FRR peers (192.168.66.x) both keep matching during the
 #       CAPI rollout. Narrow to 192.168.66.0/24 only after every node is migrated to node-local FRR.
 #bgp listen range 192.168.66.0/24 peer-group NODEPEERS
 bgp listen range 192.168.0.0/16 peer-group NODEPEERS
